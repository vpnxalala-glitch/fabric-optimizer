name: Build Auto Tower

on:
  push:
    branches: [ main ]
    paths:
      - "autotower/**"
      - ".github/workflows/autotower.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build Auto Tower
        run: gradle -p autotower clean build
      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoTower-Fabric-1.21.11
          path: autotower/build/libs/autotower-1.0.0.jar
          if-no-files-found: error
